name: Daily UAP Signal Watch

on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 23 * * 5"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Email all existing reports as separate messages"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Run watch without email/state writes"
        required: false
        default: false
        type: boolean
      force_release:
        description: "Optional release ID to force (e.g. 05)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Backfill existing reports
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill }}
        env:
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER || 'smtp' }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM || 'reports@example.com' }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: uap-signal backfill-email

      - name: Run daily watch
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.backfill) }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UAP_SIGNAL_PROVIDER: ${{ vars.UAP_SIGNAL_PROVIDER || 'openai' }}
          UAP_SIGNAL_MODEL: ${{ vars.UAP_SIGNAL_MODEL || 'gpt-4.1-mini' }}
          UAP_SIGNAL_DB: .uap_signal.db
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER || 'smtp' }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM || 'reports@example.com' }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: |
          ARGS=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          if [ -n "${{ inputs.force_release }}" ]; then
            ARGS+=(--force-release "${{ inputs.force_release }}")
          fi
          uap-signal watch "${ARGS[@]}"

      - name: Commit report and state updates
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.backfill) && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          if [ -n "$(git status --porcelain reports state)" ]; then
            git config user.name "uap-signal-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add reports state
            git commit -m "chore: daily watch report/state update"
            git push
          else
            echo "No report/state changes to commit"
          fi

      - name: Notify on failure
        if: failure()
        env:
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER || 'smtp' }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM || 'reports@example.com' }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: >
          python -c "from uap_signal.config import get_settings;
          from uap_signal.mailer import send_failure_alert;
          send_failure_alert(get_settings(), 'GitHub Actions daily watch failed. Check logs.')"
